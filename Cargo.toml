[package]
name = "qatrade-rs"
version = "0.4.0"
description = 'quantaxis in rust'
authors = ["yutiansut <yutiansut@qq.com>"]
edition = "2018"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md"
]
readme = "README.md"
categories = ["science", "algorithms"]
homepage = "https://github.com/yutiansut"
repository = "https://github.com/yutiansut/qatrader-rs"
documentation = "https://docs.rs/qatrade-rs/"
license = "MIT OR Apache-2.0"
[dependencies]
websocket = "0.27.1"

uuid = { version = "1.18.1", features = ["serde", "v4"] }
# 序列化
regex = "1.3.6"
serde_json = "1.0"
serde_derive = "1.0"
serde = { version = "1.0", features = ["derive"] } # 序列化
#
mongodb = { version = "3.3.0", features = ["sync", "bson-3"] }
amiquip = "0.4.2"
log = "0.4"
# 配置日志
clap = "4.5.49"
toml = "0.9.8"
log4rs="1.4.0"
env_logger = "0.11.8"
lazy_static = "1.4.0"
chrono = { version = "0.4", features = ["serde"] } # datetime

qifi-rs = "0.4.0"
crossbeam-channel = "0.5.15"
actix = "0.13.5"
actix-rt = "2.11.0"